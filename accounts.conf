# GHL sub-accounts this connector knows about — safe to commit, contains NO secrets.
#
# This registry is for the /ghl helper scripts and the leadconnector MCP, which read each
# account's credentials from environment variables. The `ghl` MCP server (mcp-server/) reads it
# too, but it does not need it: there, each person runs ghl_login and picks their own alias.
#
# Format (pipe-separated): alias|Display Name|TOKEN_ENV_VAR|LOCATION_ENV_VAR
#
# - "alias" is what you type after --account (bash) or -Account (PowerShell), e.g.
#     ./.claude/skills/ghl/scripts/ghl.sh --account clienta list-contacts
#     .\.claude\skills\ghl\scripts\ghl.ps1 -Account clienta list-contacts
# - TOKEN_ENV_VAR / LOCATION_ENV_VAR are the names of the environment variables that
#   hold that sub-account's real token and Location ID. The values themselves live in
#   .env (or the cloud environment's Environment Variables panel) — never in this file.
# - The row whose TOKEN_ENV_VAR is GHL_PIT_TOKEN is the DEFAULT account: it's used
#   whenever no --account / -Account is given, exactly like the original single-account
#   setup. Every other row is an ADDITIONAL sub-account.
#
# To add a sub-account:
#   1. In HighLevel, switch into that sub-account and create a Private Integration there
#      (Settings -> Other Settings -> Private Integrations). Copy its pit-... token and
#      its Location ID (Settings -> Business Profile).
#   2. Add two new environment variables (in .env, or the cloud environment's Environment
#      Variables panel) with a unique suffix, e.g.:
#        GHL_PIT_TOKEN_CLIENTA=pit-...
#        GHL_LOCATION_ID_CLIENTA=...
#   3. Add a row below mapping an alias to those two variable names.
#   4. Ask Claude to work with "clienta" (or whatever alias you chose) by name — no need
#      to open a new chat, environment, or session.

mvp|MVP Ventures|GHL_PIT_TOKEN|GHL_LOCATION_ID
kellixiq|Kellix iQ|GHL_PIT_TOKEN_KELLIXIQ|GHL_LOCATION_ID_KELLIXIQ
gsp|GSP Events|GHL_PIT_TOKEN_GSP|GHL_LOCATION_ID_GSP
flout|Flout Software|GHL_PIT_TOKEN_FLOUT|GHL_LOCATION_ID_FLOUT
bluebirdchildcare|Bluebird Childcare|GHL_PIT_TOKEN_BLUEBIRDCHILDCARE|GHL_LOCATION_ID_BLUEBIRDCHILDCARE
djindadreaming|Djinda Dreaming Education|GHL_PIT_TOKEN_DJINDADREAMING|GHL_LOCATION_ID_DJINDADREAMING
chamberschildcare|Chambers Childcare|GHL_PIT_TOKEN_CHAMBERSCHILDCARE|GHL_LOCATION_ID_CHAMBERSCHILDCARE
